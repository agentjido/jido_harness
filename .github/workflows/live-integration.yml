name: Live provider integration

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Integration profile
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - contract
          - lifecycle

permissions:
  contents: read

jobs:
  provider:
    name: ${{ matrix.provider }} / ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: amp
          - provider: claude
          - provider: codex
          - provider: gemini
          - provider: kimi
          - provider: opencode
          - provider: grok
          - provider: zai
    env:
      JIDO_HARNESS_INTEGRATION_PROFILE: ${{ inputs.profile }}
      JIDO_HARNESS_INTEGRATION_PROVIDERS: ${{ matrix.provider }}
      JIDO_HARNESS_INTEGRATION_STRICT: "true"
      AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KIMI_MODEL_NAME: "k3"
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: mix deps.get
      - name: Install the provider CLI and ACP entry point
        run: |
          mix run -e '
            provider = String.to_existing_atom(System.fetch_env!("JIDO_HARNESS_INTEGRATION_PROVIDERS"))
            case Jido.Harness.install(provider) do
              {:ok, _result} -> :ok
              {:error, error} -> raise inspect(error)
            end
          '
      - name: Run the selected live contracts
        run: >-
          mix test --include integration test/integration/providers_test.exs
          --timeout 7200000
