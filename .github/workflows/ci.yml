name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v5
    secrets: inherit
    with:
      credo_command: mix credo --min-priority higher
      validate_hex_package: true
      docs_command: mix docs -f html --warnings-as-errors
      test_matrix: '[{"otp":"28","elixir":"1.19"},{"otp":"29","elixir":"1.20"}]'
      test_command: mix test

  antigravity:
    name: Antigravity ACP compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Mix tools
        run: |
          mix local.hex --force
          mix local.rebar --force
      - run: mix deps.get
      - name: Install pinned ACP wrapper without package scripts
        run: >-
          npm install --prefix "$RUNNER_TEMP/antigravity-acp"
          --ignore-scripts --no-audit --no-fund
          @simonepri/refined-antigravity-acp@1.2.11
      - name: Test wrapper failures and session recovery without model requests
        env:
          HARNESS_TEST_ANTIGRAVITY_ACP_PATH: ${{ runner.temp }}/antigravity-acp/node_modules/.bin/refined-antigravity-acp
        run: >-
          mix test --no-cover --include antigravity_wrapper
          test/jido_harness/antigravity_test.exs

  native:
    name: Native process lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Install Mix tools
        run: |
          mix local.hex --force
          mix local.rebar --force
      - run: mix deps.get
      - name: Test native startup, process groups, PTY, and packaged helper
        env:
          HARNESS_STARTUP_BATCHES: "250"
        run: >-
          mix test
          --no-cover
          --include soak
          test/jido_harness/process_startup_regression_test.exs
          test/jido_harness/native_runtime_test.exs
          test/jido_harness/process_manager_test.exs
          test/jido_harness/environment_mode_test.exs
          test/jido_harness/escript_test.exs
      - name: Build the source package
        run: mix hex.build
      - name: Test a clean package consumer, escript, and erlexec coexistence
        run: python3 test/support/fixtures/escript/verify_package.py jido_harness-*.tar
